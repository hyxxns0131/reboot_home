services:
  - type: web
    name: reboot-us
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: flask --app app:create_app setup-db && gunicorn -w 2 --timeout 200 -b 0.0.0.0:$PORT 'app:create_app()'
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: '0'
      - key: COOKIE_SECURE
        value: '1'
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CUSTOMER_EMAIL
        sync: false
      - key: CUSTOMER_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HIGGSFIELD_API_KEY_ID
        sync: false
      - key: HIGGSFIELD_API_KEY_SECRET
        sync: false
